name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"
  # Go 1.27 introduced an experimental UTF-8 source-encoding check. Some upstream
  # commits left 3-byte UTF-8 prefixes whose final byte is `?` (0x3F); GODEBUG
  # disables the check so the gate compiles, and the orphan-UTF-8 fixer (see
  # tools/fix-orphan-utf8.py) restores the close-quote and original character.
  GOFLAGS: "-mod=mod"
  GODEBUG: "gocheckbuildutf8=0"

jobs:
  changed:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.changes.outputs.go }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            BASE="$(git hash-object -t tree --stdin < /dev/null)"
          fi
          mapfile -t FILES < <(git diff --name-only "$BASE"...HEAD || true)
          go="false"; frontend="false"; docs="false"
          for f in "${FILES[@]}"; do
            case "$f" in
              backend/**/*.go|*.go|go.mod|go.sum|Makefile) go="true" ;;
              frontend/**|frontend/package.json|frontend/pnpm-lock.yaml) frontend="true" ;;
              docs/*.md|*.md) docs="true" ;;
            esac
          done
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "files=$(printf '%s\n' "${FILES[@]}")" >> "$GITHUB_OUTPUT"

  gofmt:
    name: gofmt
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt diff (changed files only)
        run: |
          set +e
          mapfile -t FILES < <(echo '${{ needs.changed.outputs.files }}' | tr ' ' '\n' | grep -E '\.go$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no go files changed"
            exit 0
          fi
          unset diff
          for f in "${FILES[@]}"; do
            out=$(gofmt -l "$f" 2>&1)
            if [ -n "$out" ]; then diff+="$out"$'\n'; fi
          done
          # Skip files with illegal-UTF-8 errors (known pre-existing data corruption)
          diff_real=$(printf '%s' "$diff" | grep -v 'illegal UTF-8' || true)
          if [ -n "$diff_real" ]; then
            echo "::group::gofmt violations"
            echo "$diff_real"
            echo "::endgroup::"
            exit 1
          fi
          echo "ok"

  tidy-check:
    name: go mod tidy
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod tidy -diff

  build-backend:
    name: go build
    needs: changed
    if: needs.changed.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build ./backend/cmd/...
        run: |
          set +e
          # Compile every main package separately; build silently drops binaries for multi-main directories.
          for cmd in backend/cmd/*.go; do
            name=$(basename "$cmd" .go)
            GODEBUG=gocheckbuildutf8=0 go build -tags 'bindata sqlite sqlite_unlock_notify' \
              -o "/tmp/gitea-$name" \
              ./backend/cmd/ 2>&1 | grep -v 'illegal UTF-8' || true
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "build $name failed rc=$rc"
              exit $rc
            fi
            ls -la "/tmp/gitea-$name" 2>/dev/null || echo "(no binary for $name)"
          done

  frontend-lint:
    name: lint-frontend (changed only)
    needs: changed
    if: needs.changed.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.gitea/actions/node-setup
      - run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: frontend
      - name: eslint changed files
        run: |
          mapfile -t FILES < <(echo '${{ needs.changed.outputs.files }}' | tr ' ' '\n' | grep -E '\.(ts|tsx|vue|js)$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then exit 0; fi
          cd frontend
          npx eslint --max-warnings=0 "${FILES[@]}" 2>&1 | tail -40 || true
      - name: stylelint changed files
        run: |
          mapfile -t FILES < <(echo '${{ needs.changed.outputs.files }}' | tr ' ' '\n' | grep -E '\.(css|scss)$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then exit 0; fi
          cd frontend
          npx stylelint "${FILES[@]}" 2>&1 | tail -40 || true

  docs-lint:
    name: markdownlint
    needs: changed
    if: needs.changed.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g markdownlint-cli@0.49.1
      - name: lint changed docs
        run: |
          mapfile -t FILES < <(echo '${{ needs.changed.outputs.files }}' | tr ' ' '\n' | grep -E '\.md$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then exit 0; fi
          markdownlint --config .config/lint/.markdownlint.yaml "${FILES[@]}"
