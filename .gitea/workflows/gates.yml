name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"
  GODEBUG: "gocheckbuildutf8=0"

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt check (changed .go files only)
        run: |
          mapfile -t FILES < <(git diff --name-only HEAD~1 HEAD -- '*.go' 'backend/**/*.go' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no .go files changed"
            exit 0
          fi
          fail=0
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            out=$(gofmt -l "$f" 2>/dev/null || true)
            if [ -n "$out" ]; then
              echo "$out"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "gofmt ok"

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod tidy -diff

  build:
    name: go build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: |
          go build -tags 'bindata sqlite sqlite_unlock_notify' ./backend/cmd/ 2>&1 | grep -v 'illegal UTF-8'
