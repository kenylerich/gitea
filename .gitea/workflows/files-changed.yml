name: files-changed

on:
  workflow_call:
    outputs:
      backend:
        value: ${{ jobs.detect.outputs.backend }}
      frontend:
        value: ${{ jobs.detect.outputs.frontend }}
      docs:
        value: ${{ jobs.detect.outputs.docs }}
      actions:
        value: ${{ jobs.detect.outputs.actions }}
      templates:
        value: ${{ jobs.detect.outputs.templates }}
      docker:
        value: ${{ jobs.detect.outputs.docker }}
      dockerfile:
        value: ${{ jobs.detect.outputs.dockerfile }}
      swagger:
        value: ${{ jobs.detect.outputs.swagger }}
      yaml:
        value: ${{ jobs.detect.outputs.yaml }}
      json:
        value: ${{ jobs.detect.outputs.json }}
      e2e:
        value: ${{ jobs.detect.outputs.e2e }}
      shell:
        value: ${{ jobs.detect.outputs.shell }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docs: ${{ steps.changes.outputs.docs }}
      actions: ${{ steps.changes.outputs.actions }}
      templates: ${{ steps.changes.outputs.templates }}
      docker: ${{ steps.changes.outputs.docker }}
      dockerfile: ${{ steps.changes.outputs.dockerfile }}
      swagger: ${{ steps.changes.outputs.swagger }}
      yaml: ${{ steps.changes.outputs.yaml }}
      json: ${{ steps.changes.outputs.json }}
      e2e: ${{ steps.changes.outputs.e2e }}
      shell: ${{ steps.changes.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - "**/*.go"
              - "templates/**/*.tmpl"
              - "assets/emoji.json"
              - "go.mod"
              - "go.sum"
              - "Makefile"
              - ".config/lint/.golangci.yml"
              - ".editorconfig"
              - "options/locale/locale_en-US.json"
              - "backend/models/fixtures/**"
              - "tests/*.ini.tmpl"
              - "tests/gitea-repositories-meta/**"
              - "tests/testdata/**"
              - "tools/test-integration.sh"

            frontend:
              - "frontend/**"
              - "tools/**/*.ts"
              - "tools/**/*.json"
              - "tools/playwright.sh"
              - "assets/emoji.json"
              - "Makefile"

            docs:
              - "**/*.md"
              - ".config/lint/.markdownlint.yaml"
              - "frontend/package.json"
              - "frontend/pnpm-lock.yaml"
              - "frontend/pnpm-workspace.yaml"

            actions:
              - ".gitea/workflows/*"
              - ".gitea/actions/**"
              - "Makefile"

            templates:
              - "tools/lint-templates-*.ts"
              - "templates/**/*.tmpl"
              - ".config/tools/pyproject.toml"
              - ".config/tools/uv.lock"

            docker:
              - ".gitea/workflows/pull-docker-dryrun.yml"
              - ".gitea/actions/docker-dryrun/**"
              - "Dockerfile"
              - "Dockerfile.rootless"
              - "contrib/packaging/docker/**"
              - "Makefile"

            dockerfile:
              - "Dockerfile"
              - "Dockerfile.rootless"

            swagger:
              - "templates/swagger/*.json"
              - "Makefile"
              - "frontend/package.json"
              - "frontend/pnpm-lock.yaml"
              - "frontend/pnpm-workspace.yaml"
              - ".config/lint/.spectral.yaml"

            yaml:
              - "**/*.yml"
              - "**/*.yaml"
              - ".config/lint/.yamllint.yaml"
              - ".config/tools/pyproject.toml"

            json:
              - "**/*.json"
              - "**/*.json5"
              - "frontend/eslint.json.config.ts"

            e2e:
              - "tests/e2e/**"
              - "tools/test-e2e.sh"
              - "tools/playwright.sh"

            shell:
              - "**/*.sh"
              - ".config/lint/.shellcheckrc"

