root = "."
tmp_dir = ".air"

[build]
pre_cmd = ["killall -9 gitea 2>/dev/null || true"] # kill off potential zombie processes from previous runs
cmd = "make --no-print-directory backend"
entrypoint = ["./gitea"]
delay = 2000
include_ext = ["go", "tmpl"]
include_file = ["main.go"]
include_dir = ["backend/cmd", "backend/models", "backend/modules", "options", "backend/routers", "backend/services"]
exclude_dir = [
  "backend/models/fixtures",
  "backend/modelmigration/fixtures",
  "backend/modules/avatar/identicon/testdata",
  "backend/modules/avatar/testdata",
  "backend/modules/git/tests",
  "backend/modules/migration/file_format_testdata",
  "backend/routers/private/tests",
  "backend/services/gitdiff/testdata",
]
exclude_regex = ["_test.go$", "_gen.go$"]
stop_on_error = true

[log]
main_only = true
